version = 1

test_patterns = [
  "src/**/__tests__/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "e2e/**"
]

exclude_patterns = [
  ".next/**",
  "node_modules/**",
  "dist/**",
  "public/**",
  "coverage/**"
]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
environment = ["nodejs", "browser"]
module_system = "es-modules"

[[analyzers]]
name = "sql"
enabled = true
